[package]
name = "get-service-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
oxc_parser = "0.53.0"
oxc_allocator = "0.53.0"
oxc_ast = "0.53.0"
oxc_span = "0.53.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.0", features = ["serde"] }
walkdir = "2"
rayon = "1"
